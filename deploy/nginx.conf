server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), serial=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    location = /source.zip {
        default_type application/zip;
    }
    location = /LICENSE.txt {
        default_type text/plain;
    }
    location ~ /\. {
        deny all;
    }
}
